<text x="590" y="181" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#183347">Responders versus progressive disease</text>
<text x="590" y="213" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#183347">DESeq2 Wald statistic → LISA profile</text>
<text x="590" y="264" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#087E8B">responders_vs_pd_on</text>

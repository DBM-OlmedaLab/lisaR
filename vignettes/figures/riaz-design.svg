<title id="title">Riaz selected FULL design</title><desc id="desc">Two differential-expression comparisons, responders versus progressive disease before and during nivolumab, feed two LISA profiles. The descriptive contrast is during minus before. STANDARD and FULL both use only these two analyses and one contrast.</desc>

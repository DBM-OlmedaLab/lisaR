<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="970" viewBox="0 0 1100 970" role="img" aria-labelledby="title desc">
<title id="title">From a prepared study to reusable results</title><desc id="desc">An upstream model supplies differential-expression results. lisaR runs enrichment, annotates gene sets with a pre-built dictionary and hierarchy, and saves the results and HTML report. Saved results branch into static browsing, selected figure generation and reuse, and portable export. These later tasks do not repeat DE, GSEA or ORA or change fixed assignments. Exported static reports contain no live generation controls.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="45" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#183347">From a prepared study to reusable results</text>
<text x="35" y="80" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183347">Existing results enter the pipeline; semantic resources are prepared beforehand.</text>

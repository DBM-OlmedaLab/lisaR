<text x="35" y="772" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#183347">Browsing, figure generation and export do not repeat DE, GSEA or ORA.</text>
<text x="35" y="804" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#183347">Original scientific results and fixed LISA assignments stay unchanged.</text>
<text x="35" y="836" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#183347">Exported static copies have no live generation controls.</text>
<text x="35" y="878" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#183347">Optional profile contrast: A minus B, with each side&#x27;s evidence retained.</text>
<text x="35" y="905" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#183347">Category summaries and profile differences are descriptive, not new tests.</text>
<text x="35" y="941" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#183347">No LLM is called when lisaR analyses a study.</text>
</svg>

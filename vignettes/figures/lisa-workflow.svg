<text x="35" y="518" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183347">Choose the task you need.</text>
<rect x="35" y="555" width="310" height="172" rx="10" fill="#EAF6F4" stroke="#B9CBD5"/>

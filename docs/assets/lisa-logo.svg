<!-- Card variant of assets/lisa-logo-original.svg: identical artwork, viewBox trimmed to the drawn bounds (x 70-1120.5, y 94-376) so the mark fills a project card without empty canvas. Do not redraw or restyle; regenerate from the original if the logo changes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="56 80 1080 310">
    <!-- Neutral backing for GitHub dark mode; the approved logo artwork below is unchanged. -->
    <rect x="56" y="80" width="1080" height="310" rx="16" fill="#ffffff"/>
    
    <defs>

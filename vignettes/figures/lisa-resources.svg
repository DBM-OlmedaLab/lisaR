<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<title id="title">The resources used by lisaR</title><desc id="desc">Memberships link genes to gene sets, the dictionary links gene sets to categories with tier, and the category map places categories within supercategories. A native KEGG map is a separate optional graphical resource.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="45" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#183347">Resources have different roles</text>
<rect x="35" y="110" width="310" height="235" rx="10" fill="#EEF5F8" stroke="#B9CBD5"/>
<text x="51" y="145" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#183347">Gene-set memberships</text>
<text x="51" y="193" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#183347">Gene set ↔ gene</text>
<text x="51" y="223" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#183347">Defines the sets used by GSEA</text>
<text x="51" y="253" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#183347">and optional ORA.</text>
<text x="51" y="308" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#087E8B">Obtained separately</text>
<rect x="395" y="110" width="310" height="235" rx="10" fill="#EEF5F8" stroke="#B9CBD5"/>
<text x="411" y="145" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#183347">LISA dictionary</text>
<text x="411" y="193" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#183347">Gene set ↔ category</text>
<text x="411" y="223" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#183347">Stores accepted assignments</text>
<text x="411" y="253" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#183347">and their tier.</text>
<text x="411" y="308" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#087E8B">Core and expanded included</text>
<rect x="755" y="110" width="310" height="235" rx="10" fill="#EEF5F8" stroke="#B9CBD5"/>
<text x="771" y="145" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#183347">Category hierarchy</text>
<text x="771" y="193" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#183347">Category → supercategory</text>
<text x="771" y="223" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#183347">Organises related categories</text>
<text x="771" y="253" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#183347">for summaries and navigation.</text>
<text x="771" y="308" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#087E8B">Included</text>
<line x1="348" y1="214" x2="390" y2="214" stroke="#087E8B" stroke-width="2.5"/>
<polygon points="390,214 380.0950818741206,218.78462087522354 380.0950818741206,209.21537912477646" fill="#087E8B"/>
<line x1="708" y1="214" x2="750" y2="214" stroke="#087E8B" stroke-width="2.5"/>
<polygon points="750,214 740.0950818741205,218.78462087522354 740.0950818741205,209.21537912477646" fill="#087E8B"/>
<text x="35" y="398" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#183347">Native KEGG maps are optional graphics, separate from KEGG gene-set memberships.</text>
<text x="35" y="432" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#183347">Pre-built annotations are reused locally; they are not inferred from the study.</text>
</svg>

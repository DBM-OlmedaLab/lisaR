<text x="55" y="137" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#183347">B · Before treatment</text>
<text x="55" y="181" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#183347">Responders versus progressive disease</text>
<text x="55" y="213" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#183347">DESeq2 Wald statistic → LISA profile</text>
<text x="55" y="264" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#087E8B">responders_vs_pd_pre</text>
<rect x="570" y="103" width="450" height="190" rx="10" fill="#EEF5F8" stroke="#B9CBD5"/>
